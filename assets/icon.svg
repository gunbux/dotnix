<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24273a"/>
      <stop offset="1" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="flake" gradientUnits="userSpaceOnUse" x1="-150" y1="-150" x2="150" y2="150">
      <stop offset="0" stop-color="#7ebae4"/>
      <stop offset="1" stop-color="#5277c3"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- snowflake: six arms with branches, drawn once and rotated -->
  <g transform="translate(256 236)" stroke="url(#flake)" stroke-width="22" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="-96" x2="-40" y2="-136"/>
      <line x1="0" y1="-96" x2="40" y2="-136"/>
      <line x1="0" y1="-46" x2="-30" y2="-76"/>
      <line x1="0" y1="-46" x2="30" y2="-76"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <circle r="26" fill="#181926" stroke="url(#flake)"/>
  </g>

  <!-- shell prompt badge -->
  <g transform="translate(256 420)">
    <rect x="-110" y="-40" width="220" height="80" rx="24" fill="#1e2030" stroke="#363a4f" stroke-width="6"/>
    <text x="0" y="16" text-anchor="middle" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="46" font-weight="700" fill="#cad3f5">~/.<tspan fill="#a6da95">_</tspan></text>
  </g>
</svg>
