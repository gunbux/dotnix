# Appended to kitty.conf on macOS (see modules/home/kitty.nix).
# CoreText's automatic matching picks SemiBold instead of the installed Bold face.
bold_font JetBrainsMonoNFM-Bold
bold_italic_font JetBrainsMonoNFM-BoldItalic

# Left Option sends Alt so nvim/tmux Meta bindings work; right Option still types symbols.
macos_option_as_alt left

# Cmd-based bindings, out of the way of PaperWM's Option hotkeys.
map cmd+t launch --type=tab --cwd=current
map cmd+k clear_terminal scrollback active
map cmd+shift+h previous_tab
map cmd+shift+l next_tab
