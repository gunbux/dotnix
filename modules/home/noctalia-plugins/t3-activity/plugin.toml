# T3 Activity — the phone's T3 Code Live Activity pill, on the bar.
#
# A headless service reads T3's state database every few seconds, adds the
# other linked machines' threads from T3 Connect like the phone does, and
# publishes which threads are working, waiting on you, or just finished. The bar pill
# counts threads per state ("2 working · 1 done"), a dim icon when idle;
# clicking it lists the threads, and each row opens its thread in T3.

id = "chun/t3-activity"
name = "T3 Activity"
version = "0.1.0"
plugin_api = 26
author = "chun"
license = "MIT"
tags = ["ai", "t3"]
icon = "sparkles"
description = "Live T3 Code agent activity: what is working, what needs approval or input, and what just finished."

[[setting]]
key = "t3_home"
type = "string"
label_key = "settings.t3_home.label"
description_key = "settings.t3_home.description"
default = "~/.t3"

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 2
min = 1
max = 30
step = 1

[[setting]]
key = "finished_window"
type = "int"
label_key = "settings.finished_window.label"
description_key = "settings.finished_window.description"
default = 30
min = 0
max = 1440
step = 5

[[setting]]
key = "t3_connect"
type = "bool"
label_key = "settings.t3_connect.label"
description_key = "settings.t3_connect.description"
default = true

[[service]]
id = "watcher"
entry = "watcher.luau"

[[widget]]
id = "pill"
entry = "bar.luau"

[[panel]]
id = "threads"
entry = "panel.luau"
width = 520
height = 440
placement = "floating"
position = "center"
